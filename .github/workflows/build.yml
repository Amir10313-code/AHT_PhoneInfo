name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mahirex-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/mahirex-release.jks" >> "$GITHUB_ENV"
            echo "Using your own release key"
          else
            echo "No KEYSTORE_BASE64 secret: falling back to the debug key"
          fi
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --verbose --print-certs "$f" | tee "$RUNNER_TEMP/cert.txt"
          done
          if grep -q "Android Debug" "$RUNNER_TEMP/cert.txt"; then
            echo "::warning::APK is signed with the DEBUG key. Add the KEYSTORE_* secrets for a stable, owner-controlled signature."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: MAHIREX Pulse
          path: app/build/outputs/apk/release/*.apk
